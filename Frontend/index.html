<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The backend sets this for its own API responses, but that doesn't cover
         pages served by this frontend. Without it, browsers fall back to their
         own default (modern ones already default to strict-origin-when-cross-origin,
         but older ones use no-referrer-when-downgrade, which leaks the full
         path/query — e.g. Google OAuth or password-reset flows — to any
         cross-origin sub-resource, such as Google Fonts). Set explicitly rather
         than relying on browser defaults. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>IIT Palakkad Dashboard</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;0,8..60,800;1,8..60,400&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_API_BASE_URL%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
