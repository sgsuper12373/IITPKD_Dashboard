# ============================================================================
# Apache VirtualHost for dashboard.iitpkd.ac.in
#
# Reviewed/updated from the live server config on 2026-09-07. Changes from
# what's currently deployed, and why:
#
#   1. Added RequestHeader set X-Forwarded-Proto "https" — the backend's
#      ProxyFix (TRUST_PROXY_HOPS=1) reads this to know the original request
#      was HTTPS. mod_proxy sets X-Forwarded-For automatically, but does NOT
#      set X-Forwarded-Proto on its own; without this line Flask sees every
#      request as plain HTTP regardless of what the client actually used.
#
#   2. Added ProxyPreserveHost On — forwards the original Host header
#      (dashboard.iitpkd.ac.in) to the backend instead of the proxy target's
#      host. Not security-critical for this app specifically (nothing in the
#      Flask code relies on request.host — that was deliberately replaced
#      with an explicit FRONTEND_ORIGIN env var), but it's the correct
#      default for any reverse proxy and costs nothing.
#
#   3. Replaced the blind cookie-hardening line with the guarded version
#      already present in apache-security.conf (checks whether Secure /
#      HttpOnly / SameSite are already there before appending). The old line
#      appended all three unconditionally; since Flask's own
#      add_security_headers hook does the same retrofit (checking presence
#      first), the two together could have produced a cookie like
#      "...; Secure; HttpOnly; SameSite=Lax; Secure; HttpOnly; SameSite=Lax"
#      the moment any feature ever sets a cookie. Currently inert — this app
#      sets none (pure JWT) — but wrong to leave as a landmine for later.
#
#   4. AllowOverride All -> AllowOverride None — the SPA rewrite rule already
#      lives directly in this file, not in a .htaccess, so .htaccess override
#      capability on the docroot is unused privilege. Nothing writes into
#      /var/www/html today, so this is defense-in-depth, not a fix for an
#      active issue.
#
#   5. Removed the HSTS header from the :80 block — browsers only honor
#      Strict-Transport-Security received over HTTPS per RFC 6797, so on the
#      plain-HTTP redirect vhost it was a no-op. Cosmetic only.
#
# Everything else (SSL cert paths, the full header set, caching rules, the
# four ProxyPass routes, logging) is unchanged from the working config.
# ============================================================================

<VirtualHost *:80>
    ServerName dashboard.iitpkd.ac.in

    Redirect permanent / https://dashboard.iitpkd.ac.in/
</VirtualHost>

<VirtualHost *:443>
    ServerName dashboard.iitpkd.ac.in
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/dashboard.crt
    SSLCertificateKeyFile /etc/ssl/private/dashboard.key
    SSLCertificateChainFile /etc/ssl/certs/dashboard-chain.crt

    AddType image/avif .avif

    # ── Security headers ──────────────────────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-XSS-Protection "0"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https://dashboard.iitpkd.ac.in; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://dashboard.iitpkd.ac.in https://accounts.google.com; frame-src https://accounts.google.com https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # ── Cookie hardening (for Flask/app-origin cookies) ───────────────────
    # Guarded edits — only append the attribute if it isn't already present,
    # so this can't double up with Flask's own retrofit in add_security_headers.
    Header always edit Set-Cookie "^((?!.*\bSecure\b).*)$" "$1; Secure"
    Header always edit Set-Cookie "^((?!.*\bHttpOnly\b).*)$" "$1; HttpOnly"
    Header always edit Set-Cookie "^((?!.*\bSameSite\b).*)$" "$1; SameSite=Lax"

    # ── Hide server identity ──────────────────────────────────────────────
    Header always unset Server
    Header always set Server "Apache"

    # ── Caching ───────────────────────────────────────────────────────────
    <FilesMatch "\.(html|txt|xml)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|webp|avif|woff2|woff|ttf|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    AddDefaultCharset UTF-8

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # ── Reverse proxy to the Flask/gunicorn backend ────────────────────────
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass "/api" "http://127.0.0.1:5000/api"
    ProxyPassReverse "/api" "http://127.0.0.1:5000/api"

    ProxyPass "/auth" "http://127.0.0.1:5000/auth"
    ProxyPassReverse "/auth" "http://127.0.0.1:5000/auth"

    ProxyPass "/uploads" "http://127.0.0.1:5000/uploads"
    ProxyPassReverse "/uploads" "http://127.0.0.1:5000/uploads"

    ProxyPass "/health" "http://127.0.0.1:5000/health"
    ProxyPassReverse "/health" "http://127.0.0.1:5000/health"

    ErrorLog /var/log/httpd/dashboard-error.log
    CustomLog /var/log/httpd/dashboard-access.log combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
