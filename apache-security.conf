# ============================================================================
# APACHE SECURITY HEADERS
#
# Include in your VirtualHost block:
#
#   <VirtualHost *:443>
#       ServerName dashboard.iitpkd.ac.in
#       Include /path/to/apache-security.conf
#       ...
#   </VirtualHost>
#
# Or place contents in .htaccess if AllowOverride Headers is enabled.
#
# Required modules (enable with a2enmod):
#   mod_headers
#
# This is the SINGLE source of truth for transport-level security headers.
# Flask intentionally does NOT set HSTS (controlled by SET_HSTS env var,
# defaults to off) to avoid duplicate-header violations (RFC 6797).
# ============================================================================

<IfModule mod_headers.c>

    # ── HSTS — force HTTPS for 1 year ──────────────────────────────────────
    # Applied once here so every response (static files, API, etc.) gets
    # exactly one HSTS header.  Do NOT also enable HSTS in Flask.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ── Prevent MIME-sniffing ──────────────────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"

    # ── Clickjacking protection ───────────────────────────────────────────
    Header always set X-Frame-Options "DENY"

    # ── Referrer policy ────────────────────────────────────────────────────
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ── Disable legacy XSS auditor (CSP is the modern replacement) ────────
    Header always set X-XSS-Protection "0"

    # ── Restrict browser features ─────────────────────────────────────────
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # ── Content Security Policy ───────────────────────────────────────────
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https://dashboard.iitpkd.ac.in; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://dashboard.iitpkd.ac.in https://accounts.google.com; frame-src https://accounts.google.com https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # ── Cookie hardening ──────────────────────────────────────────────────
    # Ensures ALL Set-Cookie headers (from Flask, WAF, or any upstream)
    # carry Secure, HttpOnly, and SameSite before reaching the browser.
    # This covers static-file responses (robots.txt, etc.) that Flask
    # never sees.
    #
    # Each "edit" only adds the flag if it is not already present.
    Header always edit Set-Cookie "^((?!.*\bSecure\b).*)$" "$1; Secure"
    Header always edit Set-Cookie "^((?!.*\bHttpOnly\b).*)$" "$1; HttpOnly"
    Header always edit Set-Cookie "^((?!.*\bSameSite\b).*)$" "$1; SameSite=Lax"

</IfModule>
